name: Multiplatform Assembly Build & Release

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64 (ELF64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM & OpenSSL dev
        run: sudo apt-get update && sudo apt-get install -y nasm gcc libssl-dev
      - name: Build & Audit ELF64
        run: |
          make
          mv daimonos daimonos-linux-x86_64
          file daimonos-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: daimonos-linux-x86_64
          path: daimonos-linux-x86_64

  build-windows:
    name: Windows x86_64 (Win64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: make mingw-w64-x86_64-nasm mingw-w64-x86_64-gcc mingw-w64-x86_64-openssl
      - name: Build & Audit Win64 PE32+
        run: |
          make
          mv daimonos.exe daimonos-windows-x86_64.exe
          file daimonos-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: daimonos-windows-x86_64
          path: daimonos-windows-x86_64.exe

  build-macos:
    name: macOS x86_64 (Mach-O 64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Install NASM & OpenSSL
        run: brew install nasm openssl@3
      - name: Build & Audit Mach-O 64
        run: |
          make
          mv daimonos daimonos-macos-x86_64
          file daimonos-macos-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: daimonos-macos-x86_64
          path: daimonos-macos-x86_64

  build-macos-arm64:
    name: macOS Apple Silicon (ARM64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL
        run: brew install openssl@3
      - name: Build & Audit ARM64 Mach-O
        run: |
          make
          mv daimonos daimonos-macos-arm64
          file daimonos-macos-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: daimonos-macos-arm64
          path: daimonos-macos-arm64

  release:
    name: Publish Official Release
    needs: [build-linux, build-windows, build-macos, build-macos-arm64]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 Checksums
        run: |
          cd release-assets
          sha256sum daimonos-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
